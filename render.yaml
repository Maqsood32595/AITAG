services:
  # -------------------------------------------------------------
  # 🚀 Production Environment (main branch)
  # -------------------------------------------------------------
  - type: web
    name: aitag-platform
    env: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  # -------------------------------------------------------------
  # 🧪 Staging / Dev Environment (develop branch & PR Previews)
  # -------------------------------------------------------------
  - type: web
    name: aitag-dev
    env: node
    plan: starter
    region: oregon
    branch: develop
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  # -------------------------------------------------------------
  # 🔬 Refactor / Fractal Architecture Environment (refactor/parent-child-grandchild)
  # -------------------------------------------------------------
  - type: web
    name: aitag-refactor
    env: node
    plan: starter
    region: oregon
    branch: refactor/parent-child-grandchild
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

# -------------------------------------------------------------
# 🔀 Automatic Pull Request Preview Environments
# -------------------------------------------------------------
previews:
  generation: automatic
  expireAfterDays: 3
