name: AITAG CI/CD Pipeline — Test & Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - NewLandingPageVersion2
  pull_request:
    branches:
      - main
      - NewLandingPageVersion2

jobs:
  # -------------------------------------------------------------
  # 🧪 GATE 1: In-RAM Ephemeral Twin (PIET) Automated Test Suite
  # -------------------------------------------------------------
  test:
    name: Run PIET Test Suite (78 Invariants)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run PIET Invariant Gates
        env:
          NODE_ENV: test
          PORT: 5005
          TEST_BASE_URL: http://127.0.0.1:5005
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'piet-ci-cd-test-jwt-secret-string-256bit' }}
        run: node tests/piet/piet.mjs

  # -------------------------------------------------------------
  # 🚀 GATE 2: Build & Deploy to Google Cloud Run
  # -------------------------------------------------------------
  deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/NewLandingPageVersion2')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: corded-cable-460921-u1

      - name: Build & Push Container with Cloud Build
        run: |
          BUILD_ID=$(gcloud builds submit \
            --quiet \
            --suppress-logs \
            --project corded-cable-460921-u1 \
            --tag gcr.io/corded-cable-460921-u1/aitag-staging:latest \
            --format="value(id)" || true)
          echo "Dispatched Cloud Build: $BUILD_ID"
          BUILD_STATUS=$(gcloud builds describe "$BUILD_ID" --project corded-cable-460921-u1 --format="value(status)")
          echo "Cloud Build $BUILD_ID status: $BUILD_STATUS"
          if [ "$BUILD_STATUS" != "SUCCESS" ]; then
            echo "Cloud Build failed with status: $BUILD_STATUS"
            exit 1
          fi

      - name: Deploy Revision to Google Cloud Run
        run: |
          gcloud run deploy aitag-staging \
            --quiet \
            --project corded-cable-460921-u1 \
            --image gcr.io/corded-cable-460921-u1/aitag-staging:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated

      - name: Deployment Health Check
        run: |
          echo "Verifying live edge deployment..."
          curl -f -s https://aitag.in/api/domains || echo "Edge warming up..."

